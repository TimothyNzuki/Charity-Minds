<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Charity Minds</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="bg-gray-400 min-h-screen">
    <!-- Header -->
    <header
      class="bg-amber-700 shadow-md p-6 flex justify-between items-center text-white"
    >
      <h1 class="text-3xl font-bold">Charity Minds - Register</h1>

      <div id="pageLinks">
        <nav>
          <ul class="flex space-x-6 list-none gap-6">
            <li>
              <a
                href="index.html"
                class="hover:text-blue-500  {{window.location.pathname.includes('index.html') ? 'text-blue-700 font-semibold underline' : ''}} "
                >Home</a
              >
            </li>
            <li>
              <a
                href="register.html"
                class="hover:text-blue-500  {{window.location.pathname.includes('register.html') ? 'text-blue-700 font-semibold underline' : ''}}"
                >Register</a
              >
            </li>
            <li>
              <a
                href="login.html"
                class="hover:text-blue-500  {{window.location.includes('login.html') ? 'text-blue-700 font-semibold underline' : ''}}"
                >Login</a
              >
            </li>
            <li>
              <a
                href="dashboard.html"
                class="hover:text-blue-500 {{window.location.includes('dashboard.html') ? 'text-blue-700 font-semibold underline' : ''}}"
              >
                Dashboard</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="bg-white shadow-lg rounded-lg p-8 w-full mt-4 mx-auto max-w-md">
      <h1 class="text-2xl font-bold mb-6 text-center text-blue-500">
        Register
      </h1>

      <!-- Registration Form -->
      <form id="registrationForm" class="space-y-3.5">
        <div>
          <label for="firstName" class="block text-gray-700 font-semibold mb-2"
            >First Name</label
          >
          <input
            id="firstName"
            type="text"
            class="w-full border rounded-lg p-2"
            placeholder="Enter first name"
            required
          />
        </div>

        <div>
          <label for="lastName" class="block text-gray-700 font-semibold mb-2"
            >Last Name</label
          >
          <input
            id="lastName"
            type="text"
            class="w-full border rounded-lg p-2"
            placeholder="Enter last name"
            required
          />
        </div>

        <div>
          <label for="userName" class="block text-gray-700 font-semibold mb-2"
            >User Name</label
          >
          <input
            id="username"
            type="text"
            class="w-full border rounded-lg p-2"
            placeholder="Enter user name"
            required
          />
        </div>

        <div>
          <label for="email" class="block text-gray-700 font-semibold mb-2"
            >Email</label
          >
          <input
            id="email"
            type="email"
            class="w-full border rounded-lg p-2"
            placeholder="Enter email"
            required
          />
        </div>

        <div>
          <label for="phone" class="block text-gray-700 font-semibold mb-2"
            >Phone Number</label
          >
          <input
            id="phone"
            type="tel"
            class="w-full border rounded-lg p-2"
            placeholder="Enter phone number"
            required
          />
        </div>

        <div>
          <label for="dob" class="block text-gray-700 font-semibold mb-2"
            >Date of Birth</label
          >
          <input
            id="dob"
            type="date"
            class="w-full border rounded-lg p-2"
            required
          />
        </div>

        <div>
          <label for="gender" class="block text-gray-700 font-semibold mb-2"
            >Gender</label
          >
          <select id="gender" class="w-full border rounded-lg p-2" required>
            <option value="">--Select Gender--</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div>
          <label for="password" class="block text-gray-700 font-semibold mb-2"
            >Password</label
          >
          <input
            id="password"
            type="password"
            class="w-full border rounded-lg p-2"
            placeholder="Enter password"
            required
          />
        </div>

        <div>
          <label
            for="confirmPassword"
            class="block text-gray-700 font-semibold mb-2"
            >Confirm Password</label
          >
          <input
            id="confirmPassword"
            type="password"
            class="w-full border rounded-lg p-2"
            placeholder="confirm password"
            required
          />
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 rounded-lg py-3 px-6 text-white font-semibold shadow"
        >
          Register
        </button>
      </form>
    </div>

    <script src="register.js"></script>
  </body>
</html>
