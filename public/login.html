<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login-Charity Minds</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="bg-gray-500 h-screen">
    <div>
      <!-- Header -->
      <header
        class="bg-amber-700 shadow-md p-6 flex justify-between items-center text-white"
      >
        <h1 class="text-3xl font-bold">Charity Minds - Login</h1>

        <!--Hamburger button-->
        <button id="menuToggle" class="md:hidden focus:outline-none">
          <!--Icons-->

          <svg
            class="w-8 h-8"
            fill="none"
            stroke="currentcolor"
            viewbox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6H20 M4 12H20 M4 18H20"
            ></path>
          </svg>
        </button>

        <!--Desktop Nav-->
        <div>
          <nav id="navLink" class="hidden md:block">
            <ul
              class="flex flex-col md:flex-row md:space-x-6 space-y-4 md:space-y-0 list-none"
            >
              <li>
                <a
                  href="index.html"
                  class="hover:text-blue-500  {{window.location.pathname.includes('index.html') ? 'text-blue-700 font-semibold underline' : ''}} "
                  >Home</a
                >
              </li>
              <li>
                <a
                  href="register.html"
                  class="hover:text-blue-500  {{window.location.pathname.includes('register.html') ? 'text-blue-700 font-semibold underline' : ''}}"
                  >Register</a
                >
              </li>
              <li>
                <a
                  href="login.html"
                  class="hover:text-blue-500  {{window.location.includes('login.html') ? 'text-blue-700 font-semibold underline' : ''}}"
                  >Login</a
                >
              </li>
              <li>
                <a
                  href="dashboard.html"
                  class="hover:text-blue-500 {{window.location.includes('dashboard.html') ? 'text-blue-700 font-semibold underline' : ''}}"
                >
                  Dashboard</a
                >
              </li>
            </ul>
          </nav>
        </div>
      </header>
    </div>

    <div class="w-full max-w-md mx-auto mt-4 bg-white p-6 shadow-md rounded-lg">
      <h2 class="text-2xl text-gray-700 text-center font-bold mb-6">Login</h2>

      <!--Login form-->
      <form id="loginForm" class="space-y-4">
        <div>
          <label for="email" class="text-sm block font-medium text-gray-600"
            >Email</label
          >
          <input
            id="email"
            type="email"
            placeholder="Enter your email..."
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <div>
          <label for="password" class="text-sm font-medium text-gray-600"
            >Password</label
          >
          <input
            id="password"
            type="password"
            placeholder="Enter your password.."
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            required
          />
        </div>

        <p id="errorMessage" class="hidden text-red-600 text-sm"></p>

        <button
          type="submit"
          class="w-full text-white bg-amber-700 rounded-lg py-2 transition hover:bg-amber-800"
        >
          Login
        </button>

        <div class="mt-4 text-center">
          <a href="register.html" class="text-blue-600 hover:underline text-sm"
            >Don't have an accout? Register.</a
          >
        </div>
      </form>
    </div>

    <script src="login.js"></script>
  </body>
</html>
